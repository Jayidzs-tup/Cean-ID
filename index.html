      letter-spacing: 2px;
      z-index: 5;
      animation: glowPulse 2.5s ease-in-out infinite;
      width: 80%;
    }

    @keyframes glowPulse {
      0% {
        text-shadow: 0 0 5px #00f2ff, 0 0 15px #ff00ff;
      }
      50% {
        text-shadow: 0 0 10px #ffea00, 0 0 25px #00f2ff;

      align-items: center;
      justify-content: center;

      justify-content: center;

    .label {

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: softColor 6s ease-in-out infinite;
      letter-spacing: 1px;

    @keyframes softColor {
